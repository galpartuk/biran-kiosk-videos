name: mirror videos
# YouTube answers GitHub's runners with "Sign in to confirm you're not a bot" (2026-10-29), so the
# schedule runs on an office PC (scheduled.pyw). Kept for a manual try if that ever changes.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: mirror
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2   # yt-dlp needs a JS runtime for YouTube
        with:
          deno-version: v2.x
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U "yt-dlp[default]"
      - run: python fetch.py
        env:
          GH_TOKEN: ${{ github.token }}
